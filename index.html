<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="Description" content="..." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <h1>Sign Up</h1>
      <form action="/signup" method="post">
        <label for="signupUsernameInput">Username</label>
        <input type="text" name="username" id="signupUsernameInput" />
        <label for="signUpBirthDateInput">Date of birth</label>
        <input type="date" name="birthdate" id="signUpBirthDateInput" />
        <label for="signupEmailInput">Email address</label>
        <input type="email" name="email" id="signupEmailInput" />
        <div>
          <legend>Please select your closest region:</legend>
          <div>
            <input
              type="radio"
              name="region"
              id="signupRegionInputAmerica"
              value="America"
            />
            <label for="signupRegionInputAmerica">America</label>
          </div>
          <div>
            <input
              type="radio"
              name="region"
              id="signupRegionInputEurope"
              value="Europe"
            />
            <label for="signupRegionInputEurope">Europe</label>
          </div>
        </div>
        <label for="signupPasswordInput">Password</label>
        <input type="password" name="password" id="signupPasswordInput" />
        <div>
          <input
            type="checkbox"
            name="terms-of-service"
            id="signupTermsOfService"
          />
          <label for="signupTermsOfService"
            >I accept the terms of service
            <a href="/page/terms-of-service">Terms of Service</a></label
          >
        </div>
        <button type="submit" id="signupSubmitBtn">Sign up</button>
      </form>
    </main>
  </body>
</html>
